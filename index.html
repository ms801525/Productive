<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="A smooth weekly task planner — Create, In progress, Done." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Productive" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0C0D11" />
  <title>Productive — Weekly Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">productive<span class="dot">.</span></span>
    </div>

    <div class="week-nav" role="group" aria-label="Week navigation">
      <button class="icon-btn" id="prevWeek" aria-label="Previous week">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
      </button>
      <div class="week-label">
        <span class="week-tag" id="weekTag">This week</span>
        <span class="week-range" id="weekRange"></span>
      </div>
      <button class="icon-btn" id="nextWeek" aria-label="Next week">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg>
      </button>
      <button class="chip-btn" id="todayBtn">Today</button>
    </div>

    <div class="top-actions">
      <span class="reset-chip" id="resetChip" title="The current week clears Saturday at midnight">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
        <span id="resetText"></span>
      </span>
      <button class="ghost-btn" id="catBtn">
        <svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="3" /><circle cx="17" cy="7" r="3" /><circle cx="7" cy="17" r="3" /><circle cx="17" cy="17" r="3" /></svg>
        <span>Categories</span>
      </button>
      <button class="primary-btn" id="newTaskBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        <span>New task</span>
        <kbd>N</kbd>
      </button>
    </div>
  </header>

  <main class="page">
    <section class="summary">
      <div class="summary-main">
        <h1 id="headline">Let's plan the week.</h1>
        <div class="progress" aria-label="Week progress">
          <div class="progress-bar"><span id="progressFill"></span></div>
          <span class="progress-text" id="progressText"></span>
        </div>
        <span class="reset-inline">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
          <span id="resetInline"></span>
        </span>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <div class="toolbar">
      <div class="filters" id="filters" aria-label="Filter by category"></div>
      <button class="chip-btn" id="pastToggle" hidden></button>
    </div>

    <nav class="daystrip" id="daystrip" aria-label="Days of the week"></nav>

    <div class="board" id="board"></div>
  </main>

  <!-- Task modal -->
  <dialog id="taskModal" class="modal">
    <form id="taskForm" method="dialog" novalidate>
      <header class="modal-head">
        <h2 id="modalTitle">New task</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>

      <div class="modal-body">
        <label class="field">
          <span class="label">What needs doing?</span>
          <input type="text" id="fTitle" maxlength="120" placeholder="e.g. Leg day, Finish sprint report…" autocomplete="off" required />
          <span class="error" id="titleError"></span>
        </label>

        <div class="field">
          <span class="label">Day</span>
          <div class="seg seg-days" id="fDays" role="radiogroup"></div>
        </div>

        <div class="row-2">
          <label class="field">
            <span class="label">Time <em>optional</em></span>
            <input type="time" id="fTime" />
          </label>
          <div class="field">
            <span class="label">Status</span>
            <div class="seg" id="fStatus" role="radiogroup"></div>
          </div>
        </div>
        <span class="error" id="timeError"></span>

        <div class="field">
          <span class="label">Category</span>
          <div class="cat-pick" id="fCats" role="radiogroup"></div>
        </div>

        <div class="field">
          <span class="label">Priority <em>1 = most urgent</em></span>
          <div class="seg seg-prio" id="fPrio" role="radiogroup"></div>
        </div>

        <label class="field">
          <span class="label">Location <em>optional</em></span>
          <div class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z" /><circle cx="12" cy="10" r="2.5" /></svg>
            <input type="text" id="fLocation" maxlength="160" placeholder="Clinic, office, gym address…" autocomplete="off" />
          </div>
        </label>

        <label class="field">
          <span class="label">Notes <em>optional</em></span>
          <textarea id="fNotes" rows="3" maxlength="2000" placeholder="Details, links, things to bring…"></textarea>
        </label>
      </div>

      <footer class="modal-foot">
        <button type="button" class="danger-btn" id="deleteBtn" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="ghost-btn" data-close>Cancel</button>
        <button type="submit" class="primary-btn" id="saveBtn">Add task</button>
      </footer>
    </form>
  </dialog>

  <!-- Categories modal -->
  <dialog id="catModal" class="modal modal-sm">
    <div>
      <header class="modal-head">
        <h2>Categories</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>
      <div class="modal-body">
        <p class="hint">Tap a swatch to change its color. Changes save instantly.</p>
        <ul class="cat-list" id="catList"></ul>
        <form class="cat-add" id="catAddForm">
          <input type="color" id="newCatColor" value="#8B5CF6" aria-label="New category color" />
          <input type="text" id="newCatName" maxlength="30" placeholder="New category name" autocomplete="off" />
          <button type="submit" class="primary-btn">Add</button>
        </form>
      </div>
    </div>
  </dialog>

  <button class="fab" id="fab" aria-label="New task">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button type="button" id="toastAction" hidden></button>
  </div>

  <script src="app.js"></script>
</body>
</html>
